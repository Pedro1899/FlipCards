<div 
class="center-div-100"
[@fadeOut]="showHeader ? 'hidden' : 'visible'" 
*ngIf="!showFinalState && isAuthRoot"
>
<ion-grid>
  <app-logo [getWords]="appWordAnimation" [getTiming]="timing"></app-logo>
</ion-grid>
</div>

<div *ngIf="showFinalState || !isAuthRoot" class="final-logo-style">

  <ion-grid>
    <app-logo [getWords]="[appWordAnimation[appWordAnimation.length-1]]" [getTiming]="0"></app-logo>

</ion-grid>
</div>
