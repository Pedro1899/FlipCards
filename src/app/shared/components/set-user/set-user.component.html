
<ion-row>
  <ion-col size="10" size-xs="10" size-sm="10" size-md="10" size-lg="10"
  class="ion-text-center ion-margin-top">
  <ion-input class="userName blackFont" [placeholder]='userName_placeholder' aria-label="username" appUserName [value]="userName"
    (ionInput)="allowNext($event)">
  </ion-input>
</ion-col>

<!-- Continue Button -->
<ion-col size="2" size-xs="2" size-sm="2" size-md="2" size-lg="2" class="ion-margin-top">
  <app-custom-button 
  [validButton]="validNext" icon="arrow-forward-circle-outline"
    class="nextButton-icon center-div"
    (clicked)="Next()"
  ></app-custom-button>
</ion-col>

</ion-row>
