<ion-button *ngIf="icon" class="transparent indigo center-div" 
[ngClass]="border?'border-indigo':''"
>
  <ion-col  class="custom-col" size="3">
    <ion-icon [name]="icon" class="icon"></ion-icon>
  </ion-col> 
  <ion-col  class="custom-col ion-text-left" size="9" >{{text}}</ion-col> 
</ion-button>

<ion-button *ngIf="!icon" class="transparent indigo center-div">
  {{text}}
</ion-button>
