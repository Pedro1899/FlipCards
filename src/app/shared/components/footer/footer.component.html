<ion-footer class="custom-footer " collapse="fade">

    <ion-row class="ion-text-center color">   
      <ion-col size="3" class="ion-padding-start center-Left-0h">
        <ion-icon name="person-circle" class="footer-icon" (click)="click_profile()"></ion-icon>
    
      </ion-col>
      <ion-col size="7"></ion-col>
      <ion-col size="2" class="center-right-0h ion-padding-end" (click)="click_exit()">
        <ion-icon name="chevron-collapse" class="footer-icon-exit"></ion-icon>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
